name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact reviewed source
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: source-${{ github.sha }}
          path: ${{ runner.temp }}/source.tar.gz
          retention-days: 3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Test frontend request safety and TypeScript
        working-directory: web
        run: npm test && npx --no-install tsc --noEmit
      - name: Build production UI
        working-directory: web
        run: npm run build
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test with race detector
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Build Linux and Windows binaries
        run: make dist
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: build-${{ github.sha }}
          path: |
            dist/
            internal/webui/dist/
          retention-days: 3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare isolated browser acceptance
        run: |
          python -m pip install -r tests/browser/requirements.txt
          python -m playwright install --with-deps chromium
          go build -o "$RUNNER_TEMP/monik-audit-server" ./tests/fixtures/audit-server
      - name: Exercise real UI against loopback fixture
        run: python tests/browser/audit.py --fixture "$RUNNER_TEMP/monik-audit-server" --output "$RUNNER_TEMP/browser-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ github.sha }}
          path: ${{ runner.temp }}/browser-evidence/
          retention-days: 3
